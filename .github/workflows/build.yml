name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir -p source
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          test -n "$ZIP" || { echo "ZIP tidak ditemukan"; exit 1; }
          unzip -o "$ZIP" -d source
          find source -name pubspec.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Locate Flutter project
        run: |
          PUBSPEC=$(find source -name pubspec.yaml -print -quit)
          test -n "$PUBSPEC" || { echo "pubspec.yaml tidak ditemukan"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$PUBSPEC")" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: flutter pub get
        working-directory: source 

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk
          path: source/**/build/app/outputs/flutter-apk/app-release.apk
